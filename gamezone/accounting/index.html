<!doctype html><html lang="en" data-service="https://gamezone-lounge-demo.bentberyl512.chatgpt.site"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Accounting | Prime Game Zone</title><link rel="icon" href="https://gamezone-lounge-demo.bentberyl512.chatgpt.site/prime-logo.jpg"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../theme.css"><link rel="stylesheet" href="./accounting.css"></head><body>
<header><a class="brand" href="../"><img src="https://gamezone-lounge-demo.bentberyl512.chatgpt.site/prime-logo.jpg" alt=""><span>PRIME <i>GAME ZONE</i></span></a><button id="lock" hidden>Lock accounting</button></header><main><h1>Accounting</h1>
<form id="unlockAccount" class="manageForm" hidden><label>Accounting password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Unlock accounting</button></form>
<div id="workspace" hidden><div class="manageTabs"><button id="logTab">Sessions</button><button id="passesTab">Passes</button><button id="analysisTab">Analysis</button></div>
<section id="log"><h2>Start a session</h2><form id="entry" class="manageForm"><div class="formPair"><label>Station<select name="station" required></select></label><label>Session date (IST)<input name="sessionDate" type="date" required></label><fieldset class="flipTime"><legend>Starting time (IST)</legend><div class="flipRow"><label>Hour<select name="hour" required></select></label><label>Minute<select name="minute" required></select></label><label>AM / PM<select name="period" required><option>AM</option><option>PM</option></select></label></div></fieldset><label>Play time<select name="duration"><option value="30">30 minutes</option><option value="60">1 hour</option><option value="90">1 hour 30 minutes</option><option value="120">2 hours</option></select></label><label>Game (optional)<select name="game"></select></label><label>Amount paid (₹)<input type="number" name="amount" required step=".01" min="0" max="999999999.99"></label><label>Payment method<select name="payment" required><option value="">Choose payment method</option><option>Cash</option><option>Online</option></select></label></div><button class="primary">Start timer</button></form>
<h2>Session log</h2><div id="sessions"></div></section>
<section id="passes" hidden><h2>Book a station pass</h2><form id="passEntry" class="manageForm"><label>Station<select name="station" required></select></label><div class="formPair"><label>Starting day<input type="date" name="firstDay" required></label><label>Ending day (inclusive)<input type="date" name="lastDay" required></label></div><fieldset class="flipTime"><legend>Daily start time (IST)</legend><div class="flipRow"><label>Hour<select name="fromHour"></select></label><label>Minute<select name="fromMinute"></select></label><label>AM / PM<select name="fromPeriod"><option>AM</option><option>PM</option></select></label></div></fieldset><fieldset class="flipTime"><legend>Daily end time (IST)</legend><div class="flipRow"><label>Hour<select name="untilHour"></select></label><label>Minute<select name="untilMinute"></select></label><label>AM / PM<select name="untilPeriod"><option>AM</option><option>PM</option></select></label></div></fieldset><button class="primary">Book pass</button></form><h2>Station passes</h2><ul id="passList"></ul></section>
<section id="analysis" hidden><h2>Earnings and play time</h2><div class="formPair"><label>Period<select id="period"><option value="week">Week (Monday–Sunday)</option><option value="month">Month</option></select></label><label>Date in period (IST)<input id="reportDate" type="date"></label></div><div id="report"></div></section></div><p id="notice" role="status"></p></main><script src="./accounting.js"></script></body></html>
